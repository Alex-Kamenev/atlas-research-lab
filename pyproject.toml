[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research-lab"
version = "0.1.0"
description = "Synthetic knowledge-tracing research baselines, replay and learner-level evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksandar Kamenev" }]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
atlas-research-lab = "atlas_research_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlas_research_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
